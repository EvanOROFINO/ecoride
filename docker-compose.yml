# Stack locale Docker pour EcoRide
# Lance Apache+PHP+MySQL+MongoDB en un seul docker compose up
#
# Usage :
#   docker compose up -d        # démarrer la stack
#   docker compose logs -f app  # voir les logs
#   docker compose down         # tout arrêter
#
# URL : http://localhost:8000

services:
  app:
    build: .
    container_name: ecoride_app
    ports:
      - "8000:10000"
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8000
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecoride
      DB_USER: ecoride
      DB_PASSWORD: ecoride_dev_password
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: ecoride_nosql
      APP_SECRET: "docker-dev-secret-32-chars-min-aaaaa"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - .:/var/www/html  # hot reload en dev

  mysql:
    image: mariadb:11
    container_name: ecoride_mysql
    environment:
      MARIADB_ROOT_PASSWORD: root_dev_password
      MARIADB_DATABASE: ecoride
      MARIADB_USER: ecoride
      MARIADB_PASSWORD: ecoride_dev_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: ecoride_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
