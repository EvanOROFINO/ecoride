# Configuration Railway pour EcoRide
# Doc : https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "vendor/bin/heroku-php-apache2 public/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.environment]
APP_ENV = "production"
APP_DEBUG = "false"
